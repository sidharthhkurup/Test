<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="mystyle.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body>
    <div class="container">
      <div class="left-window" id="left-side-image">
        <div class="logo-title" id="logo-title">
          <div class="logo" id="logo">
            <img src="logo.jpg" alt="logo-name" height="50px" width="50px" />
          </div>
          <div class="title1" id="title1">Kafh</div>
        </div>
        <div class="welcome-text" id="">Welcome Back!</div>
        <div class="please-login" id="">Please login to your account.</div>
        <br />
        <input class="username1" type="text" placeholder="Email Address" />
        <input class="password1" type="password" placeholder="password" />

        <div class="rememb-forgot">
          <div class="rememb" id="">Remember</div>
          <div class="forgot" id="">Forgotten password?</div>
        </div>
        <div class="rememb-forgot">
          <div class="login" id="">
            <button class="button" type="button">Login</button>
          </div>
          <div class="creat-act" id="">
            <button class="button" type="button">Create Account</button>
          </div>
        </div>
        <br />
        <div class="bottum-text">
          By sign up you agree to our terms and condition.
        </div>
      </div>
      <div class="right-window">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle3"></div>
        <div class="circle4"></div>
        <div class="circle5"></div>
        <div class="circle6"></div>
        <div></div>
      </div>
    </div>
  </body>
</html>
